name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, the floor for trusted publishing.
          # Node 22 ships npm 10.x and will fail.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Disabled on purpose: a poisoned cache could expose the OIDC token.
          package-manager-cache: false

      - name: Show toolchain versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      # Runs on every push to main, not just releases, so main always
      # has a build signal even when nothing is published.
      - name: Build
        run: npm run build

      # Ask the registry rather than diffing git. This stays correct across
      # squash merges, re-runs of a failed publish, and manual triggers,
      # because the registry is the actual source of truth for what exists.
      - name: Check whether this version is already published
        id: version_check
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # npm view exits non-zero for a missing version and for a missing
          # package, and prints the version on success. Require both.
          if FOUND="$(npm view "$NAME@$VERSION" version 2>/dev/null)" && [ -n "$FOUND" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::$NAME@$VERSION is already on the registry. Bump the version in package.json to publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publishing::$NAME@$VERSION is not on the registry."
          fi

      # No NODE_AUTH_TOKEN. npm exchanges the GitHub OIDC token for a
      # short-lived registry credential, and publishes provenance automatically.
      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public
