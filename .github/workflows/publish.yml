name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, the floor for trusted publishing.
          # Node 22 ships npm 10.x and will fail.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Disabled on purpose: a poisoned cache could expose the OIDC token.
          package-manager-cache: false

      - name: Show toolchain versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN. npm exchanges the GitHub OIDC token for a
      # short-lived registry credential, and publishes provenance automatically.
      - name: Publish to npm
        run: npm publish --access public
